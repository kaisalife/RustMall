[workspace]
members = [
    "crates/common",
    "crates/metrics",
    "crates/proto",
    "crates/redis-cache",
    "crates/tower-middleware",
    "crates/idempotency",
    "crates/event-bus",
    "services/api-gateway",
    "services/auth-service",
    "services/product-service",
    "services/order-service",
    "services/inventory-service",
    "services/email-service",
    "services/payment-service",
    "services/log-service",
]
resolver = "2"

# Release 构建优化配置
[profile.release]
opt-level = 3          # 最高优化级别
lto = true             # 跨 crate 链接时优化（内联 + 死代码消除）
codegen-units = 1      # 单代码生成单元，最大化优化空间
strip = true           # 移除调试符号，减小二进制体积
panic = "abort"        # panic 时直接终止，减少 unwind 代码（容器会重启）

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# Web Framework
axum = { version = "0.7", features = ["http2"] }

# gRPC
tonic = "0.14"
prost = "0.14"

# Database
sqlx = { version = "0.7", features = [
    "postgres",
    "runtime-tokio-native-tls",
    "uuid",
    "chrono",
    "json",
    "macros",
] }

# Middleware
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = [
    "cors",
    "trace",
    "limit",
    "auth",
    "timeout",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auth
jsonwebtoken = "9.2"
bcrypt = "0.15"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Config - 使用 figment 替代 config
figment = { version = "0.10", features = ["toml", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "fmt",
    "registry",
] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# HTTP
reqwest = { version = "0.11", features = ["json", "stream"] }
http = "1.0"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.0", features = ["full"] }
hyper-util = "0.1"

# Utilities
validator = { version = "0.16", features = ["derive"] }
bytes = "1.5"
futures-util = "0.3"

# Decimal（支付系统金额类型，参考 Nautilus Trader 定点小数设计）
rust_decimal = { version = "1.34", features = ["serde-with-str"] }
rust_decimal_macros = "1.34"

# Email
lettre = { version = "0.11", features = [
    "tokio1",
    "tokio1-rustls-tls",
    "rustls-native-certs",
] }

# Async Trait
async-trait = "0.1"

# Cache
lru = "0.12"

# OpenTelemetry
opentelemetry = { version = "0.20", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.13", features = ["tonic"] }
tracing-opentelemetry = "0.21"

# Benchmarking
criterion = { version = "0.5", features = ["async_tokio"] }
