syntax = "proto3";

package inventory;

service InventoryService {
    rpc DeductStock(DeductStockRequest) returns (DeductStockResponse);
    rpc AddStock(AddStockRequest) returns (AddStockResponse);
    rpc GetStock(GetStockRequest) returns (StockResponse);
    rpc BatchGetStock(BatchGetStockRequest) returns (BatchGetStockResponse);
    rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
    rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
    rpc BatchReserveStock(BatchReserveStockRequest) returns (BatchReserveStockResponse);
    rpc BatchReleaseStock(BatchReleaseStockRequest) returns (BatchReleaseStockResponse);
}

message DeductStockRequest {
    uint64 product_id = 1;
    int32 quantity = 2;
}

message DeductStockResponse {
    bool success = 1;
    int32 remaining = 2;
}

message AddStockRequest {
    uint64 product_id = 1;
    int32 quantity = 2;
}

message AddStockResponse {
    bool success = 1;
    int32 total = 2;
}

message GetStockRequest {
    uint64 product_id = 1;
}

message StockResponse {
    uint64 product_id = 1;
    int32 quantity = 2;
    int32 reserved_quantity = 3;
    string updated_at = 4;
}

message BatchGetStockRequest {
    repeated uint64 product_ids = 1;
}

message BatchGetStockResponse {
    repeated StockResponse stocks = 1;
}

message ReserveStockRequest {
    uint64 product_id = 1;
    int32 quantity = 2;
}

message ReserveStockResponse {
    bool success = 1;
    int32 reserved = 2;
}

message ReleaseStockRequest {
    uint64 product_id = 1;
    int32 quantity = 2;
}

message ReleaseStockResponse {
    bool success = 1;
    int32 released = 2;
}

message StockItem {
    uint64 product_id = 1;
    int32 quantity = 2;
}

message BatchReserveStockRequest {
    repeated StockItem items = 1;
}

message BatchReserveStockResult {
    uint64 product_id = 1;
    bool success = 2;
    string error = 3;
}

message BatchReserveStockResponse {
    bool all_success = 1;
    repeated BatchReserveStockResult results = 2;
}

message BatchReleaseStockRequest {
    repeated StockItem items = 1;
}

message BatchReleaseStockResponse {
    bool all_success = 1;
}
