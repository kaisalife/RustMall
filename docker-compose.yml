services:
  postgres:
    image: postgres:15-alpine
    container_name: simple_trade_postgres
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple_trade
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - simple_trade_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: simple_trade_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@simple-trade.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - simple_trade_network

  redis:
    image: redis:7-alpine
    container_name: simple_trade_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - simple_trade_network

  kafka:
    image: apache/kafka:3.7.1
    container_name: simple_trade_kafka
    environment:
      # KRaft 模式配置（无需 Zookeeper）
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # 单节点配置
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    restart: unless-stopped
    networks:
      - simple_trade_network

  # Kafka 管理界面（可选，方便调试）
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: simple_trade_kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: "simple-trade"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    ports:
      - "9090:8080"
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - simple_trade_network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        SERVICE: auth-service
    container_name: simple_trade_auth
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/simple_trade
      APP_AUTH_SERVICE__HOST: 0.0.0.0
      APP_AUTH_SERVICE__PORT: "50051"
      APP_DATABASE__MAX_CONNECTIONS: "20"
      APP_KAFKA__BROKERS: "kafka:9092"
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - simple_trade_network

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        SERVICE: product-service
    container_name: simple_trade_product
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/simple_trade
      APP_PRODUCT_SERVICE__HOST: 0.0.0.0
      APP_PRODUCT_SERVICE__PORT: "50052"
      APP_DATABASE__MAX_CONNECTIONS: "40"
      APP_KAFKA__BROKERS: "kafka:9092"
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - simple_trade_network

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        SERVICE: order-service
    container_name: simple_trade_order
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/simple_trade
      APP_ORDER_SERVICE__HOST: 0.0.0.0
      APP_ORDER_SERVICE__PORT: "50053"
      APP_DATABASE__MAX_CONNECTIONS: "30"
      APP_KAFKA__BROKERS: "kafka:9092"
    ports:
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - simple_trade_network

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        SERVICE: inventory-service
    container_name: simple_trade_inventory
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/simple_trade
      APP_INVENTORY_SERVICE__HOST: 0.0.0.0
      APP_INVENTORY_SERVICE__PORT: "50054"
      APP_DATABASE__MAX_CONNECTIONS: "30"
      APP_KAFKA__BROKERS: "kafka:9092"
    ports:
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - simple_trade_network

  email-service:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        SERVICE: email-service
    container_name: simple_trade_email
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/simple_trade
      APP_EMAIL_SERVICE__HOST: 0.0.0.0
      APP_EMAIL_SERVICE__PORT: "50055"
      APP_DATABASE__MAX_CONNECTIONS: "10"
      APP_KAFKA__BROKERS: "kafka:9092"
    ports:
      - "50055:50055"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - simple_trade_network

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        SERVICE: payment-service
    container_name: simple_trade_payment
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/simple_trade
      APP_PAYMENT_SERVICE__HOST: 0.0.0.0
      APP_PAYMENT_SERVICE__PORT: "50056"
      APP_DATABASE__MAX_CONNECTIONS: "10"
      APP_KAFKA__BROKERS: "kafka:9092"
    ports:
      - "50056:50056"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - simple_trade_network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        SERVICE: api-gateway
    container_name: simple_trade_gateway
    environment:
      APP_GATEWAY__HOST: 0.0.0.0
      APP_GATEWAY__PORT: "8080"
      APP_AUTH_SERVICE__HOST: auth-service
      APP_AUTH_SERVICE__PORT: "50051"
      APP_PRODUCT_SERVICE__HOST: product-service
      APP_PRODUCT_SERVICE__PORT: "50052"
      APP_ORDER_SERVICE__HOST: order-service
      APP_ORDER_SERVICE__PORT: "50053"
      APP_INVENTORY_SERVICE__HOST: inventory-service
      APP_INVENTORY_SERVICE__PORT: "50054"
      APP_PAYMENT_SERVICE__HOST: payment-service
      APP_PAYMENT_SERVICE__PORT: "50056"
      APP_REDIS__URL: redis://redis:6379
      APP_KAFKA__BROKERS: "kafka:9092"
    # 不暴露端口，仅通过 nginx 访问
    expose:
      - "8080"
    depends_on:
      - auth-service
      - product-service
      - order-service
      - inventory-service
      - payment-service
      - redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - simple_trade_network

  log-service:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        SERVICE: log-service
    container_name: simple_trade_log
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/simple_trade
      APP_DATABASE__MAX_CONNECTIONS: "10"
      APP_KAFKA__BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - simple_trade_network

  nginx:
    image: nginx:1.25-alpine
    container_name: simple_trade_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - simple_trade_network

  # ============================================
  # 可观测性栈
  # ============================================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: simple_trade_prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.listen-address=:9090'
    expose:
      - "9090"
    depends_on:
      - api-gateway
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - simple_trade_network

  loki:
    image: grafana/loki:2.9.0
    container_name: simple_trade_loki
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    expose:
      - "3100"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - simple_trade_network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: simple_trade_promtail
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - simple_trade_network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: simple_trade_tempo
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo.yaml:ro
    command: -config.file=/etc/tempo.yaml
    expose:
      - "3200"
      - "4317"
      - "4318"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - simple_trade_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: simple_trade_otel
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    command: --config=/etc/otelcol/config.yml
    expose:
      - "4317"
      - "4318"
    depends_on:
      - tempo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - simple_trade_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: simple_trade_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - simple_trade_network

volumes:
  postgres_data:
    driver: local

networks:
  simple_trade_network:
    driver: bridge
