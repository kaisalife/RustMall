# Promtail 配置 - Docker 容器日志采集
# 参考 Promtail 2.x 标准配置

server:
  http_listen_port: 9080   # Promtail HTTP 端口
  grpc_listen_port: 0      # 禁用 gRPC

positions:
  filename: /tmp/positions.yaml   # 采集位置记录文件

# 客户端配置 - 发送到 Loki
clients:
  - url: http://loki:3100/loki/api/v1/push

# Docker 服务发现
scrape_configs:
  - job_name: simple_trade   # 采集 simple_trade 相关容器
    docker_sd_configs:
      - host: unix:///var/run/docker.sock   # Docker socket 路径
        refresh_interval: 5s                 # 容器发现刷新间隔
        filters:
          - name: name
            values: ["simple_trade_"]        # 按容器名前缀过滤，仅采集 simple_trade 相关容器
    relabel_configs:
      # 提取容器名作为标签（去除前导斜杠）
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      # 提取日志流类型（stdout/stderr）
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    pipeline_stages:
      # 解析 JSON 日志，提取字段
      - json:
          expressions:
            level: level
            service_name: fields.service_name
            request_id: fields.request_id
      # 将提取的字段作为 Loki 标签
      - labels:
          level:
          service_name:
          request_id:
