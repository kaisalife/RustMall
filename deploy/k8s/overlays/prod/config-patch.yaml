# Prod: ConfigMap 指向云托管服务
# 替换 <REPLACE_ME> 为真实地址
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_DATABASE__HOST: "<REPLACE_ME>.rds.amazonaws.com"
  APP_REDIS__URL: "redis://<REPLACE_ME>.elasticache.amazonaws.com:6379"
  APP_KAFKA__BROKERS: "<REPLACE_ME>.msk.amazonaws.com:9092"
  APP_NACOS__SERVER_ADDR: "<REPLACE_ME>:8848"
  APP_TRACING__OTLP_ENDPOINT: "http://<REPLACE_ME>:4317"
  APP_DATABASE__MIN_CONNECTIONS: "10"
  APP_DATABASE__ACQUIRE_TIMEOUT_SECONDS: "30"
  APP_DATABASE__MAX_LIFETIME_MINUTES: "60"
  APP_ENV: "production"
