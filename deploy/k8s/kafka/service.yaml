apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: simple-trade
  labels:
    app: kafka
    app.kubernetes.io/part-of: simple-trade
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: client
    - port: 9093
      targetPort: 9093
      name: controller
  type: ClusterIP
