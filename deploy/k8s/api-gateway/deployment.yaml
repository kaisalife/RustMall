apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: simple-trade
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: simple-trade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/kaisalife/rustmall/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: APP_GATEWAY__HOST
              value: "0.0.0.0"
            - name: APP_GATEWAY__PORT
              value: "8080"
            # 后端 gRPC 服务地址（Nacos 关闭时使用静态地址）
            - name: APP_AUTH_SERVICE__HOST
              value: "auth-service"
            - name: APP_AUTH_SERVICE__PORT
              value: "50051"
            - name: APP_PRODUCT_SERVICE__HOST
              value: "product-service"
            - name: APP_PRODUCT_SERVICE__PORT
              value: "50052"
            - name: APP_ORDER_SERVICE__HOST
              value: "order-service"
            - name: APP_ORDER_SERVICE__PORT
              value: "50053"
            - name: APP_INVENTORY_SERVICE__HOST
              value: "inventory-service"
            - name: APP_INVENTORY_SERVICE__PORT
              value: "50054"
            - name: APP_PAYMENT_SERVICE__HOST
              value: "payment-service"
            - name: APP_PAYMENT_SERVICE__PORT
              value: "50056"
            - name: APP_NACOS__ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
