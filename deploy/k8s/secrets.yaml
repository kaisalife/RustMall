apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: simple-trade
  labels:
    app.kubernetes.io/part-of: simple-trade
type: Opaque
data:
  # PostgreSQL 凭据（base64 编码，生产环境务必替换）
  # postgres     => cG9zdGdyZXM=
  # simple_trade => c2ltcGxlX3RyYWRl
  APP_DATABASE__USERNAME: cG9zdGdyZXM=
  APP_DATABASE__PASSWORD: cG9zdGdyZXM=
  APP_DATABASE__DATABASE: c2ltcGxlX3RyYWRl

  # JWT 密钥（base64 编码，生产环境务必替换）
  # simple-trade-jwt-secret-change-in-production => c2ltcGxlLXRyYWRlLWp3dC1zZWNyZXQtY2hhbmdlLWluLXByb2R1Y3Rpb24=
  APP_JWT__SECRET: c2ltcGxlLXRyYWRlLWp3dC1zZWNyZXQtY2hhbmdlLWluLXByb2R1Y3Rpb24=

  # Email SMTP 密码（base64 编码，生产环境务必替换）
  # your-app-password => eW91ci1hcHAtcGFzc3dvcmQ=
  APP_EMAIL__SMTP_PASSWORD: eW91ci1hcHAtcGFzc3dvcmQ=
