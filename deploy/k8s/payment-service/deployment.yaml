apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: simple-trade
  labels:
    app: payment-service
    app.kubernetes.io/part-of: simple-trade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/kaisalife/rustmall/payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50056
              name: grpc
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: APP_PAYMENT_SERVICE__HOST
              value: "0.0.0.0"
            - name: APP_PAYMENT_SERVICE__PORT
              value: "50056"
            - name: APP_PAYMENT_SERVICE__ADVERTISE_HOST
              value: "payment-service"
            - name: APP_DATABASE__MAX_CONNECTIONS
              value: "10"
            - name: APP_NACOS__ENABLED
              value: "true"
          readinessProbe:
            grpc:
              port: 50056
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50056
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
