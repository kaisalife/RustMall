apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-service
  namespace: simple-trade
  labels:
    app: log-service
    app.kubernetes.io/part-of: simple-trade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: log-service
    spec:
      priorityClassName: standard
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command: ['sh', '-c', 'until pg_isready -h postgres -p 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done;']
      containers:
        - name: log-service
          image: ghcr.io/kaisalife/rustmall/log-service:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: APP_DATABASE__MAX_CONNECTIONS
              value: "10"
            - name: APP_NACOS__ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
