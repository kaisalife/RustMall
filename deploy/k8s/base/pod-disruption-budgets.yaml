apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: simple-trade
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: simple-trade
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
