apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: simple-trade
  labels:
    app.kubernetes.io/part-of: simple-trade
type: Opaque
# 注意：以下为占位符，生产环境务必替换为真实凭据
stringData:
  APP_DATABASE__USERNAME: "<REPLACE_ME>"
  APP_DATABASE__PASSWORD: "<REPLACE_ME>"
  APP_DATABASE__DATABASE: "<REPLACE_ME>"
  APP_JWT__SECRET: "<REPLACE_ME>"
  APP_EMAIL__SMTP_PASSWORD: "<REPLACE_ME>"
