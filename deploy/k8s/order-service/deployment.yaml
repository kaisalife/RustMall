apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: simple-trade
  labels:
    app: order-service
    app.kubernetes.io/part-of: simple-trade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/kaisalife/rustmall/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50053
              name: grpc
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: APP_ORDER_SERVICE__HOST
              value: "0.0.0.0"
            - name: APP_ORDER_SERVICE__PORT
              value: "50053"
            - name: APP_ORDER_SERVICE__ADVERTISE_HOST
              value: "order-service"
            - name: APP_DATABASE__MAX_CONNECTIONS
              value: "30"
            - name: APP_NACOS__ENABLED
              value: "true"
          readinessProbe:
            grpc:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50053
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
