# CI 工作流
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-rustmall"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libssl-dev pkg-config libpq-dev libcurl4-openssl-dev libsasl2-dev zlib1g-dev libzstd-dev cmake
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: |
          output=$(cargo clippy --workspace --all-targets -- -D warnings 2>&1)
          status=$?
          if [ $status -ne 0 ]; then
            echo "$output" > /tmp/clippy_error.txt
            # Truncate to 65000 chars for GitHub issue body limit
            head -c 65000 /tmp/clippy_error.txt > /tmp/clippy_truncated.txt
            # Create GitHub issue with error output
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues \
              -d "$(jq -n --arg title "CI Lint Failure (${{ github.sha }})" \
                       --arg body "$(cat /tmp/clippy_truncated.txt)" \
                       '{title: $title, body: ("```\n" + $body + "\n```"), labels: ["ci-failure"]}')"
            echo "::error::Clippy failed. Issue created with error details."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-rustmall"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libssl-dev pkg-config libpq-dev libcurl4-openssl-dev libsasl2-dev zlib1g-dev libzstd-dev cmake
      - name: Run tests
        run: |
          output=$(cargo test --workspace --verbose 2>&1)
          status=$?
          if [ $status -ne 0 ]; then
            echo "$output" > /tmp/test_error.txt
            head -c 65000 /tmp/test_error.txt > /tmp/test_truncated.txt
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues \
              -d "$(jq -n --arg title "CI Test Failure (${{ github.sha }})" \
                       --arg body "$(cat /tmp/test_truncated.txt)" \
                       '{title: $title, body: ("```\n" + $body + "\n```"), labels: ["ci-failure"]}')"
            echo "::error::Tests failed. Issue created with error details."
            exit 1
          fi

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2024-0387 --ignore RUSTSEC-2026-0173

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-rustmall"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libssl-dev pkg-config libpq-dev libcurl4-openssl-dev libsasl2-dev zlib1g-dev libzstd-dev cmake
      - name: Build release
        run: cargo build --release --workspace
