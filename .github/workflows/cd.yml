# CD 工作流 - 打 tag v*.*.* 时触发部署
name: CD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
      deploy_k8s:
        description: "Deploy to Kubernetes (requires KUBECONFIG secret)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - order-service
          - inventory-service
          - email-service
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          build-args: |
            SERVICE=${{ matrix.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-compose:
    name: Deploy (Docker Compose)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/simple_trade
            docker-compose pull
            docker-compose up -d --no-deps --build
            docker image prune -f
      - name: Health check
        run: |
          sleep 10
          for i in $(seq 1 30); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.DEPLOY_HOST }}:8080/health || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i: HTTP $RESPONSE, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed!"
          exit 1

  deploy-k8s:
    name: Deploy (Kubernetes)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.deploy_k8s == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
      - name: Deploy to Kubernetes
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl apply -k deploy/k8s/overlays/prod/
      - name: Wait for rollout
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl -n simple-trade rollout status deployment/api-gateway --timeout=300s
          kubectl -n simple-trade rollout status deployment/auth-service --timeout=300s
          kubectl -n simple-trade rollout status deployment/product-service --timeout=300s
          kubectl -n simple-trade rollout status deployment/order-service --timeout=300s
          kubectl -n simple-trade rollout status deployment/inventory-service --timeout=300s
      - name: Cleanup
        run: rm -f /tmp/kubeconfig
        if: always()
